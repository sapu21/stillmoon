name: Stillmoon
options:
  bundleIdPrefix: app.stillmoon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StillmoonCore:
    path: StillmoonCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Stillmoon:
    type: application
    platform: iOS
    sources:
      - path: App/Stillmoon
        excludes: ["Info.plist"]
    dependencies:
      - package: StillmoonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stillmoon.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Stillmoon/Info.plist
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Stillmoon listens for snoring, speech and coughing on this iPhone during a sleep session you start. Sound is analyzed on the device and never recorded or stored."
        INFOPLIST_KEY_CFBundleDisplayName: Stillmoon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/Stillmoon/Stillmoon.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Stillmoon reads your sleep from Apple Health to show your nights and suggest a next step. Your sleep data stays on this iPhone."
        INFOPLIST_KEY_NSCameraUsageDescription: "For the optional calm check: your fingertip over the camera and flash gives a heart rate estimate. Only the numbers are kept, never images."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Stillmoon saves completed exercises to Apple Health as Mindful Minutes and, if you turn it on, how tense you said you felt as State of Mind."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # No app icon yet; the asset catalog only holds artwork.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  StillmoonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/StillmoonTests
    dependencies:
      - target: Stillmoon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  StillmoonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/StillmoonUITests
    dependencies:
      - target: Stillmoon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stillmoon:
    build:
      targets:
        Stillmoon: all
    test:
      targets:
        - StillmoonTests
        - StillmoonUITests
